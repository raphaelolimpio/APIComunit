version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: comunit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comunit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_super_segura}
      POSTGRES_DB: ${POSTGRES_DB:-comunit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    build: .
    container_name: comunit_api
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - db
    volumes:
      - ./app:/app/app 

volumes:
  postgres_data: